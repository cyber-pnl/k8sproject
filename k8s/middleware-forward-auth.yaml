apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
  namespace: default
spec:
  forwardAuth:
    # Utilise le FQDN : le pod traefik (ns kube-system) ne résout pas le nom court
    # vers le namespace default (ses search domains commencent par kube-system.svc...).
    address: http://auth-service.default.svc.cluster.local:3001/auth/session
    trustForwardHeader: true
    # Copies ces en-têtes de la réponse ForwardAuth vers la requête aval
    # (le frontend et les services /api* lisent toujours x-user-*)
    authResponseHeaders:
      - X-User-Id
      - X-User-Name
      - X-User-Role