apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: default
  labels:
    app: course-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
        tier: backend
    spec:
      containers:
        - name: course-service
          image: ghcr.io/cyber-pnl/k8sproject/course-service:382b60cb6a32888148b460b6b07da1ddd8a57787
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          envFrom:
            - secretRef:
                name: app-secret
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: s3-secret
          env:
            - name: REDIS_HOST
              value: redis-service
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: default
spec:
  selector:
    app: course-service
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
  type: ClusterIP