# Active le provider Kubernetes Gateway API sur Traefik (k3s).
# Géré par ArgoCD (dossier k8s/). ArgoCD applique la HelmChartConfig
# dans kube-system : helm-controller redéploie Traefik avec le provider
# kubernetesGateway activé.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true